jobs.llm.model=gemini-3.5-flash-lite
jobs.llm.batch-size=40
jobs.refresh.cron=0 0 5 * * *
jobs.refresh.zone=Asia/Kolkata
server.port=${PORT:28081}

# Persistent local H2 database
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/beep_fresher_db}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jobs API config (keys from environment variables only)
jobs.jobspipe.base-url=https://api.jobspipe.dev
jobs.jobspipe.api-key=${JOBSPIPE_API_KEY:}
jobs.jobspipe.limit=25
jobs.jobspipe.max-pages=10

jobs.jsearch.base-url=https://jsearch.p.rapidapi.com
jobs.jsearch.api-key=${JSEARCH_API_KEY:}
jobs.jsearch.host=jsearch.p.rapidapi.com
jobs.jsearch.pages-per-query=4

jobs.jooble.base-url=${JOOBLE_BASE_URL:https://in.jooble.org}
jobs.jooble.api-key=${JOOBLE_API_KEY:}
jobs.jooble.pages-per-query=4
jobs.jooble.results-per-page=25

# Vite dev server ports; override with APP_CORS_ALLOWED_ORIGINS outside development.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5175}


jobs.llm.api-key=${GEMINI_API_KEY:}
